# Hypridle — fixed wake-from-sleep / black screen issues
# Backup: hypridle.conf.bak.*
# See: https://wiki.hyprland.org/Hypr-Ecosystem/hypridle

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    # Force panel on after resume (s2idle + i915 often leave DPMS off).
    # Delay avoids racing Hyprland/Aquamarine connector re-scan right after thaw.
    after_sleep_cmd = sleep 0.5 && hyprctl dispatch 'hl.dsp.dpms({action = "on"})' && brightnessctl -r
}

listener {
    timeout = 350
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# turn off keyboard backlight, comment out this section if you dont have a keyboard backlight.
#listener {
#    timeout = 350
#    on-timeout = brightnessctl -sd rgb:kbd_backlight set 0
#    on-resume = brightnessctl -rd rgb:kbd_backlight
#}

listener {
    timeout = 900
    on-timeout = loginctl lock-session
}

listener {
    timeout = 1200
    # Official 0.56 API: {action = "on"|"off"} (string 'on' also works but is less reliable)
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' && brightnessctl -r
}

listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
